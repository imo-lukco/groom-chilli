# fly.toml app configuration file generated for groom-chilli on 2026-05-20T10:26:53Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "groom-chilli"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
